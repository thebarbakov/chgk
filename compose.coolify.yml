services:
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./back
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    restart: unless-stopped
    environment:
      NODE_ENV: ${APP_NODE_ENV:-production}
      PORT: "4000"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Coolify}
      ADMIN_LOGIN: ${ADMIN_LOGIN:?Set ADMIN_LOGIN in Coolify}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in Coolify}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in Coolify}
      CORS_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the public application URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./front
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
        NEXT_PUBLIC_API_BASE: ${APP_ORIGIN:?Set APP_ORIGIN to the public application URL}
        NEXT_PUBLIC_MEDIA_BASE: ${APP_ORIGIN:?Set APP_ORIGIN to the public application URL}
        NEXT_PUBLIC_WS_URL: ${APP_WS_URL:-}
    restart: unless-stopped

volumes:
  uploads:
